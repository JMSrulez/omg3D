services:
  web:
    image: nginx:alpine
    ports:
      - 8081:80 # change en 80:80 ou 443 si tu as déjà un reverse-proxy
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - contact
    restart: unless-stopped
  contact:
    build: ./backend
    environment:
      # --- SMTP (à adapter) ---
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_TO: ${MAIL_TO:-ContactOmg3D@marseille.men}
      MAIL_FROM: ${MAIL_FROM:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://omg3d.marseille.men}
      MAX_FILE_MB: ${MAX_FILE_MB:-25}
    restart: unless-stopped
    # pas d'exposition publique : uniquement via nginx

networks: {}
